<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>L'ANSE</title>
<!--
=============================================================================
L'ANSE · stories from the low places, taken down as they were told
a literary text game · prototype containing chapters Four and Eleven
=============================================================================

WORLD BIBLE (working notes)

PLACE
  L'Anse aux Chênes, a Black Creole settlement on Bayou Croche, southern
  Louisiana. A gravel levee road, a store (Duplechin's), a syrup mill long
  gone whose smell the road kept, cane on the Thibodeaux side, a cemetery
  called St. Ambroise on the oak ridge (the chénière). The Cajun town of
  Bon Secours is close enough to hear its church bell when the wind turns.
  Nobody in the text explains any of this. The place is navigated by smell,
  engine sound, water level, and story.

TIME
  Chapter Four: summer 1981. Chapter Eleven: All Saints' Day, 1993.
  Both are middles of a larger missing anthology. Nothing begins or ends.

FOLKLORE GROUND RULES (kept accurate to the living tradition)
  - The traiteuse must be ASKED for treatment; she cannot offer.
  - She is never thanked. Thanks undoes the prayer. Gifts are left, not given.
  - Treatment does not cross running water.
  - The cordon: a string knotted over whispered prayer, tied where it hurts,
    never touching the ground, burned after nine days.
  - The prayers pass down privately. If untold, they die with the teller.
  - Catholicism, hoodoo, dream-reading, and practical medicine share one
    kitchen. Nobody in the text sorts them. The text never decides what is
    objectively real. That suspension is the whole game and is protected.

VOICE RULES
  - Oral. Long breath. Nobody performs. Nobody is astonished by anything.
  - No em dashes. No "not X but Y" constructions. No writerly display.
  - Kouri-Vini and Louisiana French surface unglossed: mais, chère, piti,
    gardé donc, couyon, fé chaud. The reader learns the way a visitor does.
  - The worst things arrive domestic and unremarked. The reader finds the
    horror alone. Beauty arrives the same way, by smell and kitchen light.

ARCHITECTURE
  Single file plus an optional remote director. Four layers:
    1. DATA   · two passage graphs (C4, C11). A passage = paragraphs
               (strings, found-paper blocks, or functions of state), plus
               authored choices or an ending.
    2. ENGINE · render() and fill(). Passages append down the page like a
               book. A chosen line and its answering paragraph stay behind;
               the reader's attention becomes part of the manuscript.
    3. DIRECTOR · optional; two tiny enum-only calls per complete reading.
               It quietly selects and orders later authored choices. Nothing
               generated is inserted into the story, and no names leave it.
    4. SHELL  · title page ("the shelf"), save/restore via localStorage,
               chapter completion marks, a quiet way to forget everything.
  To extend into the larger anthology: add a new passage graph, add one
  entry to CHAPTERS. Nothing else changes.

SOUND (recommended, not implemented; all beds below -30dB, no music)
  Shelf ........ near silence; one distant dog, twice, far left.
  Chapter 4 .... daytime cicada bed; a single-cylinder engine passing once
                 early on and never again; screen door spring on the porch
                 scene; during the treating, room tone only, a clock,
                 dogs breathing, an ice box compressor cycling.
  Chapter 11 ... pre-dawn frog chorus fading to bird-quiet; brush strokes
                 on masonry, irregular, human; at candle dusk, matches,
                 and the frog chorus returning underneath; supper scene,
                 spoon on pot rim, laughter with the words removed.
  Free-text .... total silence while the input is open. The game listens.
=============================================================================
-->
<style>
  :root{
    --night:#12100c;      /* porch dark, brown before black */
    --ink:#e6dcc6;        /* aged paper */
    --dim:#93886f;        /* said and settled */
    --lamp:#c79a58;       /* kerosene, the interactive color */
    --moss:#7a8262;       /* labels, chapter heads */
    --paper:#c9bda1;      /* found documents */
    --rule:#3a352a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--night)}
  body{
    background:var(--night);
    color:var(--ink);
    font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
    font-size:clamp(1.02rem,2.4vw,1.19rem);
    line-height:1.82;
    -webkit-font-smoothing:antialiased;
  }
  #page{
    max-width:33em;
    margin:0 auto;
    padding:9vh 1.4em 40vh 1.4em;
  }
  p{margin:0 0 1.35em 0}
  .fade{opacity:0;animation:appear 1.1s ease forwards}
  @keyframes appear{to{opacity:1}}
  @media (prefers-reduced-motion:reduce){
    .fade{animation:none;opacity:1}
  }

  /* chapter heading */
  .chap{
    margin:0 0 3.2em 0;
  }
  .chap .num{
    font-size:.72em;letter-spacing:.42em;color:var(--moss);
    text-transform:uppercase;display:block;margin-bottom:.9em;
  }
  .chap .name{
    font-size:1.28em;font-style:italic;color:var(--ink);
  }
  .chap .year{
    font-size:.72em;letter-spacing:.3em;color:var(--dim);
    display:block;margin-top:.9em;
  }

  /* choices: attention, offered */
  .choices{margin:2.1em 0 2.6em 0}
  .choice{
    display:block;font-style:italic;color:var(--lamp);
    margin:0 0 1.05em 1.4em;cursor:pointer;background:none;border:none;
    font:inherit;text-align:left;line-height:1.7;padding:0;
  }
  .choice::before{content:'\00B7\00A0\00A0';color:var(--moss)}
  .choice:hover,.choice:focus-visible{text-decoration:underline;text-underline-offset:.28em;outline:none}
  /* a chosen line stays in the book, quieted */
  .chosen{
    font-style:italic;color:var(--dim);margin:0 0 1.35em 1.4em;
  }
  .chosen::before{content:'\203A\00A0\00A0';color:var(--rule)}

  /* found paper */
  .doc{
    font-family:ui-monospace,'Courier New',Courier,monospace;
    font-size:.8em;line-height:1.95;color:var(--paper);
    border-left:1px solid var(--rule);
    padding:.2em 0 .2em 1.35em;margin:0 0 1.7em .2em;
    white-space:pre-wrap;letter-spacing:.015em;
  }

  /* free text: the game listens */
  .ask{margin:2.2em 0 2.6em 1.4em}
  .ask input{
    background:transparent;border:none;border-bottom:1px solid var(--dim);
    color:var(--ink);font:inherit;font-style:italic;width:100%;
    padding:.15em 0;border-radius:0;
  }
  .ask input:focus{outline:none;border-bottom-color:var(--lamp)}
  .ask .say{
    display:inline-block;margin-top:1.1em;font-style:italic;color:var(--lamp);
    background:none;border:none;font:inherit;cursor:pointer;padding:0;
  }
  .ask .say:hover,.ask .say:focus-visible{text-decoration:underline;text-underline-offset:.28em;outline:none}

  /* the shelf (title) */
  .shelf{text-align:left;padding-top:4vh}
  .shelf h1{
    font-weight:normal;font-size:2.1em;letter-spacing:.34em;
    color:var(--ink);margin-bottom:.35em;
  }
  .shelf .sub{color:var(--dim);font-style:italic;margin-bottom:4em}
  .shelf .missing{color:var(--moss);font-size:.82em;letter-spacing:.14em;margin-bottom:3em}
  .entry{
    display:block;background:none;border:none;font:inherit;text-align:left;
    color:var(--lamp);cursor:pointer;margin-bottom:1.6em;line-height:1.7;padding:0;
  }
  .entry:hover .t,.entry:focus-visible .t{text-decoration:underline;text-underline-offset:.3em}
  .entry:focus-visible{outline:none}
  .entry .n{font-size:.7em;letter-spacing:.4em;color:var(--moss);display:block;text-transform:uppercase;margin-bottom:.3em}
  .entry .t{font-style:italic}
  .entry .mark{font-size:.72em;color:var(--dim);letter-spacing:.12em;margin-left:.8em;font-style:normal}
  .forget{
    margin-top:7em;background:none;border:none;font:inherit;font-size:.78em;
    color:var(--rule);cursor:pointer;letter-spacing:.16em;padding:0;
  }
  .forget:hover{color:var(--dim)}
  .listening{
    display:block;background:none;border:none;font:inherit;text-align:left;
    color:var(--moss);cursor:pointer;font-size:.76em;letter-spacing:.13em;
    margin:-1.2em 0 .45em;padding:0;
  }
  .listening[aria-pressed="false"]{color:var(--rule)}
  .listening:hover,.listening:focus-visible{color:var(--dim);outline:none}
  .listening-note{color:var(--rule);font-size:.68em;line-height:1.5;letter-spacing:.06em;max-width:28em}
  .choice-echo{margin:-.25em 0 1.55em 1.4em;color:var(--paper)}

  .term{
    appearance:none;background:none;border:0;border-bottom:1px dotted var(--lamp);
    color:inherit;cursor:help;font:inherit;line-height:inherit;padding:0 .02em;
  }
  .term:hover,.term:focus-visible{color:var(--lamp);outline:none;border-bottom-style:solid}
  .glossary{
    color:var(--ink);background:#1c1913;border:1px solid var(--rule);border-bottom:0;
    border-radius:1rem 1rem 0 0;width:100%;max-width:none;max-height:72vh;
    margin:auto 0 0;padding:1.4rem 1.4rem calc(1.4rem + env(safe-area-inset-bottom));
    box-shadow:0 -1rem 3rem rgba(0,0,0,.42);transform-origin:bottom;
  }
  .glossary[open]{animation:rise .22s ease-out}
  .glossary::backdrop{background:rgba(8,7,5,.72);backdrop-filter:blur(2px)}
  .glossary-kicker{color:var(--moss);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase}
  .glossary-title{font-size:1.25rem;font-weight:normal;margin:.28rem 0 .7rem}
  .glossary-body{color:var(--paper);font-size:.95rem;line-height:1.62;margin:0}
  .glossary-close{
    background:none;border:0;color:var(--lamp);cursor:pointer;font:inherit;font-style:italic;
    margin-top:1.2rem;padding:.25rem 0;
  }
  @keyframes rise{from{opacity:0;transform:translateY(1.2rem)}to{opacity:1;transform:none}}
  @media (min-width:38rem){.glossary{max-width:30rem;margin:auto auto 1.5rem;border-bottom:1px solid var(--rule);border-radius:1rem}}
  @media (prefers-reduced-motion:reduce){.glossary[open]{animation:none}}

  .return{
    display:inline-block;margin-top:3.5em;font-style:italic;color:var(--lamp);
    background:none;border:none;font:inherit;cursor:pointer;padding:0;
  }
  .return:hover{text-decoration:underline;text-underline-offset:.28em}
</style>
</head>
<body>
<div id="page"></div>
<script>
/* ========================= ENGINE ========================= */

const SAVEKEY='lanse1';
const DIRECTOR_URL='/api/lanse-director';

function defaultState(){
  return {answers:{},flags:{},done:{},at:null,director:{enabled:true,decisions:{},attempted:{}}};
}
function normalizeState(raw){
  const base=defaultState();
  if(!raw||typeof raw!=='object')return base;
  return {
    answers:raw.answers||{},flags:raw.flags||{},done:raw.done||{},at:raw.at||null,
    director:{
      enabled:raw.director&&typeof raw.director.enabled==='boolean'?raw.director.enabled:true,
      decisions:(raw.director&&raw.director.decisions)||{},
      attempted:(raw.director&&raw.director.attempted)||{}
    }
  };
}
let S=normalizeState(load());

function load(){try{return JSON.parse(localStorage.getItem(SAVEKEY))}catch(e){return null}}
function save(){try{localStorage.setItem(SAVEKEY,JSON.stringify(S))}catch(e){}}

const DIRECTOR_THREADS={
  c4:['house','water','voice'],
  c11:['kin','record','threshold']
};
const directorPending={};

function directorThread(beat){
  const thread=S.director&&S.director.decisions&&S.director.decisions[beat];
  return thread&&DIRECTOR_THREADS[beat]&&DIRECTOR_THREADS[beat].includes(thread)?thread:null;
}
function directorSignals(beat){
  if(beat==='c4')return {
    errand:S.flags.errand||'unset',route:S.flags.route||'unset',relic:S.flags.relic||'unset',
    eyes:S.flags.eyes||'unset',thank:S.flags.thank||'unset',answeredSmell:Boolean((S.answers.smell||'').trim())
  };
  return {
    answer:S.flags.answer||'unset',first:S.flags.first||'unset',overheard:S.flags.overheard||'unset',
    readChapterFour:Boolean(S.done.c4)
  };
}
async function cueDirector(beat){
  if(!S.director.enabled||S.director.decisions[beat]||S.director.attempted[beat]||directorPending[beat])return;
  S.director.attempted[beat]=true;save();
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),4500);
  directorPending[beat]=true;
  try{
    const response=await fetch(DIRECTOR_URL,{
      method:'POST',headers:{'Content-Type':'application/json'},signal:controller.signal,
      body:JSON.stringify({beat,signals:directorSignals(beat)})
    });
    if(!response.ok)throw new Error('director unavailable');
    const result=await response.json();
    if(!S.director.enabled||!DIRECTOR_THREADS[beat]||!DIRECTOR_THREADS[beat].includes(result.thread))return;
    S.director.decisions[beat]=result.thread;save();
  }catch(e){
    /* The authored baseline remains complete when the quiet director is away. */
  }finally{
    clearTimeout(timer);delete directorPending[beat];
  }
}

const GLOSSARY={
  cushcush:{title:'cush-cush',body:'A Louisiana cornmeal dish browned in a pot, often eaten with milk or cane syrup. Here it is ordinary kitchen food, memorable because Mama lets it scorch.'},
  cordon:{title:'cordon',body:'A prayer-knotted string tied near the hurt. In this telling it must stay off the ground and be burned after nine days.'},
  toussaint:{title:'Toussaint',body:'All Saints’ Day, November 1. In many Louisiana Catholic communities, families clean and whitewash graves, gather, light candles, and tend the dead together.'},
  cheniere:{title:'chénière',body:'A natural ridge of firmer, higher ground in coastal Louisiana. Oaks, settlements, and cemeteries often stand above the wet country on one.'},
  whitewash:{title:'whitewash',body:'A thin lime-and-water wash used on masonry. At St. Ambroise it is renewed before All Saints and cures paler over the following days.'},
  traiteuse:{title:'traiteuse',body:'A woman who treats illness through inherited prayer, touch, and household practice in Louisiana Creole and Cajun traditions. The treatment must be asked for.'},
  boudin:{title:'boudin',body:'A Louisiana fresh sausage commonly made with pork, rice, liver, seasoning, and green onion.'},
  poules:{title:'poules d’eau',body:'Literally “water hens”: moorhens or gallinules, dark marsh birds whose numbers and movements can tell people what the water is doing.'},
  boucherie:{title:'boucherie',body:'A communal hog-butchering and cooking day, with many hands turning the whole animal into food.'},
  pirogue:{title:'pirogue',body:'A narrow, shallow-draft boat made for bayous and marsh water.'}
};
let glossaryReturnFocus=null;
function buildGlossary(){
  const dialog=el('dialog','glossary');dialog.id='glossary';
  dialog.innerHTML='<div class="glossary-kicker">a word from the Anse</div><h2 class="glossary-title"></h2><p class="glossary-body"></p><button class="glossary-close">put it away</button>';
  dialog.querySelector('.glossary-close').onclick=()=>dialog.close();
  dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close()});
  dialog.addEventListener('close',()=>{if(glossaryReturnFocus)glossaryReturnFocus.focus();glossaryReturnFocus=null});
  document.body.appendChild(dialog);
  page().addEventListener('click',event=>{
    const trigger=event.target.closest('[data-term]');
    if(!trigger)return;
    const entry=GLOSSARY[trigger.dataset.term];if(!entry)return;
    glossaryReturnFocus=trigger;
    dialog.querySelector('.glossary-title').textContent=entry.title;
    dialog.querySelector('.glossary-body').textContent=entry.body;
    dialog.showModal();
  });
}

const page=()=>document.getElementById('page');

/* weave stored answers back into prose: [[key||what the text says if silence]] */
function fill(t){
  return t.replace(/\[\[(\w+)\|\|([^\]]*)\]\]/g,(m,k,fb)=>{
    const a=(S.answers[k]||'').trim();
    return a?a:fb;
  });
}

function el(tag,cls,html){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(html!==undefined)e.innerHTML=html;
  return e;
}

let fadeIndex=0;
function addPara(node,delay){
  node.classList.add('fade');
  node.style.animationDelay=(delay*0.55)+'s';
  page().appendChild(node);
}

/* render one passage, appended beneath everything already read */
function render(id){
  const psg=DATA[id];
  if(!psg){console.warn('missing passage',id);return null}
  const startCount=page().children.length;
  S.at=id;save();
  fadeIndex=0;

  if(psg.head){
    const h=el('div','chap');
    h.appendChild(el('span','num',psg.head.num));
    h.appendChild(el('span','name',psg.head.name));
    if(psg.head.year)h.appendChild(el('span','year',psg.head.year));
    addPara(h,fadeIndex++);
  }

  (psg.p||[]).forEach(item=>{
    let v=typeof item==='function'?item(S):item;
    if(v===null||v===undefined||v==='')return;
    if(typeof v==='object'&&v.doc!==undefined){
      addPara(el('div','doc',fill(v.doc)),fadeIndex++);
    }else{
      addPara(el('p',null,fill(v)),fadeIndex++);
    }
  });

  if(psg.choices){
    const box=el('div','choices');
    const thread=psg.director?directorThread(psg.director):null;
    const choices=psg.choices.map((choice,index)=>({choice,index}));
    if(thread)choices.sort((a,b)=>Number(b.choice.thread===thread)-Number(a.choice.thread===thread)||a.index-b.index);
    choices.forEach(({choice:c})=>{
      const copy=fill(thread&&c.variants&&c.variants[thread]?c.variants[thread]:c.t);
      const b=el('button','choice',copy);
      b.onclick=()=>{
        if(c.set)Object.assign(S.flags,c.set);
        if(c.answer)Object.assign(S.answers,c.answer);
        const directorBeat=c.set&&c.set.eyes?'c4':(c.set&&c.set.overheard?'c11':null);
        const kept=el('div','chosen',copy);
        box.replaceWith(kept);
        save();
        if(directorBeat)cueDirector(directorBeat);
        const after=typeof c.after==='function'?c.after(S):c.after;
        let echo=null;
        if(after){echo=el('p','choice-echo',fill(after));addPara(echo,0)}
        const next=render(c.go);
        settle(echo||next);
      };
      box.appendChild(b);
    });
    box.classList.add('fade');
    box.style.animationDelay=(fadeIndex*0.55)+'s';
    page().appendChild(box);
  }
  else if(psg.end){
    S.done[psg.end]=true;S.at=null;save();
    const b=el('button','return','put it back on the shelf');
    b.classList.add('fade');
    b.style.animationDelay=(fadeIndex*0.55)+'s';
    b.onclick=()=>shelf();
    page().appendChild(b);
  }
  return page().children[startCount]||null;
}

/* ease the new text into view without yanking the reader */
function settle(target){
  if(!target)return;
  const cushion=Math.max(24,Math.min(96,window.innerHeight*0.12));
  const top=target.getBoundingClientRect().top+window.scrollY-cushion;
  window.scrollTo({top:Math.max(0,top),behavior:'smooth'});
}

/* ===== the shelf ===== */
function shelf(){
  page().innerHTML='';
  const s=el('div','shelf');
  s.appendChild(el('h1',null,"L'ANSE"));
  s.appendChild(el('div','sub','stories from the low places, taken down as they were told'));
  s.appendChild(el('div','missing','THE PAGES BEFORE AND AFTER THESE TWO ARE MISSING'));

  const listen=el('button','listening',S.director.enabled?'THE TELLING LISTENS · ON':'THE TELLING LISTENS · OFF');
  listen.setAttribute('aria-pressed',String(S.director.enabled));
  listen.onclick=()=>{S.director.enabled=!S.director.enabled;save();shelf()};
  s.appendChild(listen);
  s.appendChild(el('div','listening-note','at most two brief turns per full reading; your choices stay on this device'));

  CHAPTERS.forEach(ch=>{
    const b=el('button','entry');
    let mark='';
    if(S.done[ch.id])mark='<span class="mark">read</span>';
    else if(S.at&&S.at.indexOf(ch.prefix)===0)mark='<span class="mark">your place is kept</span>';
    b.innerHTML='<span class="n">'+ch.num+'</span><span class="t">'+ch.title+'</span>'+mark;
    b.onclick=()=>{
      page().innerHTML='';
      const resume=S.at&&S.at.indexOf(ch.prefix)===0?S.at:ch.start;
      render(resume);
    };
    s.appendChild(b);
  });

  const f=el('button','forget','forget everything');
  f.onclick=()=>{
    localStorage.removeItem(SAVEKEY);
    S=defaultState();
    shelf();
  };
  s.appendChild(f);
  page().appendChild(s);
  window.scrollTo({top:0});
}

const CHAPTERS=[
  {id:'c4', prefix:'c4', num:'FOUR', title:'The Asking', start:'c4-1'},
  {id:'c11',prefix:'c11',num:'ELEVEN', title:'Toussaint', start:'c11-1'}
];
</script>
<script>
/* ========================= CHAPTER FOUR · THE ASKING · 1981 ========================= */
window.DATA = window.DATA || {};
Object.assign(DATA, {

'c4-1':{
  head:{num:'Chapter Four',name:'The Asking',year:'L\u2019ANSE AUX CH\u00CANES \u00B7 1981'},
  p:[
`The year my sister Cletha took the sun, we were living in the third house from the turn at L'Anse aux Ch\u00EAnes, the one with the cistern that leaned. I was eleven. I know it was 1981 because that was the summer Mr. Verbin got his new engine. It announced him up and down the Anse, one thick cough after another, while his reasons stayed his.`,
`It was August and the rain had quit us. Mama had Cletha out in the butterbeans by seven because by nine the rows held the heat like a pot holds it, and Cletha was eight and hardheaded and took her hat off to fan a dog with it, and left it off. She came in white around the mouth around ten thirty, walking careful, like the floor was somebody else's floor. Mama took one look and had her down on the boards where the house stays cool, wet rag going, vinegar, talking low the whole time, and the talking low was how I knew.`
  ],
  choices:[
    {t:'I listened for Cletha’s breath between the engine coughs.',after:'Her breath came shallow against the floorboards. The engine answered from somewhere past the landing.',go:'c4-2',set:{opening:'breath'}},
    {t:'I waited until Mr. Verbin’s engine went quiet.',after:'It coughed once more and quit. In that pocket of quiet I heard Mama wring the rag.',go:'c4-2',set:{opening:'engine'}}
  ]
},

'c4-2':{
  p:[
`Everybody in my family remembers that morning by a smell. Mama says the vinegar. My cousin Ti-Jean swears the <button class="term" data-term="cushcush">cush-cush</button> scorched on the stove and nobody moved to save it. Mama had never let a grain of it take the scorch before that day. Me, I say the butterbeans, that green smell a hill of them makes when they sit snapped in the colander and the day gets on top of them.`,
`You know a kitchen with trouble in it. Everybody does, one kitchen at least. What did yours smell like.`
  ],
  choices:[
    {t:'Vinegar lifting from the wet rag.',after:'It reached the back of my throat before Mama wrung the cloth again.',answer:{smell:'vinegar lifting from a wet rag'},go:'c4-3',set:{smell:'vinegar'}},
    {t:'Cornmeal taking the scorch in the pot.',after:'The bitter edge of it spread under every other smell in the room.',answer:{smell:'cornmeal taking the scorch'},go:'c4-3',set:{smell:'cushcush'}},
    {t:'Butterbeans warming green in the colander.',after:'Their field smell stayed bright beside the stove, as if the heat had just picked them.',answer:{smell:'butterbeans warming green'},go:'c4-3',set:{smell:'beans'}}
  ]
},

'c4-3':{
  p:[
`That one. Curtains take a smell like that and give it back years later. The road does the same with the syrup mill.`,
`Now folks ask why Mama did not send for Doctor Broome in Bon Secours. That question belongs to now. Broome was thirty minutes and thirty dollars away, it was Tuesday, and the truck had no gas till Friday. The sun was a thing Miss Ophelia treated, everybody’s sun, all my life. Nobody held council in the yard.`,
`Mama wrung the rag out and looked at me. She said, go by Miss Ophelia. Walk in the shade what shade there is, and don't run the whole way, you'll take the sun too, and then who I got. And listen, Alcide. You ask her yourself. She can't come at it uninvited. Say Cletha asking through me. Say it just so.`,
`I said it back to her twice, standing on one foot in the doorway, and then I went.`
  ],
  choices:[
    {t:'I kept Mama’s words whole behind my teeth.',after:'My tongue stayed against the back of them. I could feel every word without letting one loose.',go:'c4-4',set:{errand:'held'}},
    {t:'I said them under my breath until they matched my walking.',after:'Cletha asking through me. Left foot, right foot. The words found their own pace.',go:'c4-4',set:{errand:'repeated'}},
    {t:'I looked once more at Cletha, then left before fear made me run.',after:'Her eyes opened once against the cool boards. Mama laid the rag over them and pointed me toward the door.',go:'c4-4',set:{errand:'looked'}}
  ]
},

'c4-4':{
  p:[
`From our place you could go two ways. The levee road ran long, past Duplechin's store and the landing, gravel the color of a dove, no shade to speak of but a breeze off the water if the water felt like giving one. Or you could cut through the cane on the Thibodeaux side, quicker by ten minutes, green dark, rows tall as a man on a horse. Mama told us to keep out the cane without ever saying why, and the not saying why was a kind of saying.`
  ],
  choices:[
    {t:'I took the levee road, the long way, like I was told without being told.',after:'Gravel struck through my thin soles. The bayou stayed open on my right, giving no shade.',go:'c4-5a',set:{route:'levee'}},
    {t:'I cut through the cane, because Cletha was on the floor and ten minutes is ten minutes.',after:'The first leaves stitched the shade closed behind me. My shirt caught green dust at the shoulders.',go:'c4-5b',set:{route:'cane'}}
  ]
},

'c4-5a':{
  p:[
`The levee road handed me along the way it hands everybody along. Past the Fontenot place, where the dog knows your legs. Past the landing, where Mr. Verbin's new engine sat up on sawhorses with its cover off, drowned. It had gone under at the landing two days before, a whole story I only half knew, and three men stood around it bareheaded, each holding one useless tool. Mr. Verbin had the plugs out and was turning it over slow by hand, and the water came up out of it in little coughs, and one of the men said, she'll talk again, and nobody agreed and nobody argued.`,
`Past that, the water bends back on itself at the place they call On\u00E9zime's. I couldn't tell you when anybody last said On\u00E9zime's whole name in my hearing. The water there turns and holds still and keeps a green on it different from the rest of the bayou, and nobody fishes it. Nobody will tell you that in words. You just notice, over the years, that no line ever lands there, that boats take the far side without the wheel seeming to move, and by the time you're grown, your own hands do it too, and you couldn't say when they learned.`,
`I kept along in the dove-colored heat with the message in my mouth, saying it to myself. Cletha asking through me. Cletha asking through me.`
  ],
  choices:[
    {t:'I slowed at Mr. Verbin’s drowned engine.',after:'Bayou water coughed from the plug holes and darkened the dust between his shoes.',go:'c4-6',set:{roadNotice:'engine'}},
    {t:'I took the far side at Onézime’s without thinking.',after:'My feet shifted toward the grass before I had chosen. The green water kept to itself.',go:'c4-6',set:{roadNotice:'bend'}}
  ]
},

'c4-5b':{
  p:[
`The cane shut behind me before the ditch water quit shining at my back. The heat in the rows was a green heat, thick, and the leaves talked over my head about their own business. We had a game in there, all of us Anse children, where you call a name into the rows and wait, and the rule was you never called your own. I didn't play it that day. I want that understood. I was carrying a message and I walked.`,
`Midway through, the rows opened where the old Thibodeaux place stood. A chimney, alone, black gone gray, and the fig trees around it gone wild, big as barns, bees in them like a sound the heat itself was making. The figs went soft on the ground every August, that wine smell, sweet and gone over, and nobody picked them. Free figs, whole trees of them, and no child of the Anse ever took one, and no mother ever had to say don't. That was all I knew about the Thibodeaux place at eleven years old. The figs were free and nobody took them.`,
`I came out the far side with leaf cuts on my forearms, saying the message to myself. Cletha asking through me. Cletha asking through me.`
  ],
  choices:[
    {t:'I wiped the cane cuts on my shirt and kept walking.',after:'Three thin red lines showed through the cloth. By the next row the leaves had cut them again.',go:'c4-6',set:{caneNotice:'cuts'}},
    {t:'I kept my eyes off the figs beneath the chimney.',after:'One dropped behind me with a wet little sound. I did not turn to see what had touched it.',go:'c4-6',set:{caneNotice:'figs'}}
  ]
},

'c4-6':{
  p:[
`Miss Ophelia Broussard lived where the road gave up being a road, under a chinaball tree that made a shade so blue you could drink it. Two dogs came off the porch to meet me, and they didn't bark, because Anse children were a smell they were raised on, and they walked me in like it was their idea.`,
`Miss \u00C9nola was on the porch with her, the two of them shelling peas into one dishpan between them, and I stopped at the steps the way you stopped at those steps.`,
`Miss \u00C9nola had dreamed her teeth again, all of them loose in her mouth like corn in a cup, and she was tired of it, she said, tired of hauling them teeth through her sleep, and Miss Ophelia shelled on and said, teeth is talk, somebody's talking on you, and \u00C9nola said, mais let them talk then, I ain't got the water to waste on it, and they both laughed at something in that I couldn't see the shape of.`,
`Then Miss Ophelia said, without looking up, whose engine was that passing four o'clock this morning. And Miss \u00C9nola said, that was nobody. And they let it lie there between them, in the pan with the peas, and went on shelling.`
  ],
  choices:[
    {t:'I waited for the peas to strike the pan three more times.',after:'Click, click, click. Miss Énola’s thumbnail opened each hull along the seam.',go:'c4-7',set:{porchNotice:'peas'}},
    {t:'I put one foot on the bottom porch board.',after:'The board gave its small complaint. Both women heard it and neither looked up.',go:'c4-7',set:{porchNotice:'step'}}
  ]
},

'c4-7':{
  p:[
`Miss Ophelia looked at me over the pan. She had eyes with a color to them like tea against the light. She did not ask. She could not. Mama’s words sat whole under my tongue, and the first speaking belonged to me.`,
`I said, Miss Ophelia, Cletha asking through me. She took the sun this morning in the beans.`,
`She set the pan off her lap. She said, she this side the water. And I said yes ma'am, home on the floor where it's cool. She said, good. It don't cross running water, and I don't carry it over, and that's old, that's older than me. \u00C9nola, watch my peas.`,
`Miss \u00C9nola said, them peas grown, they don't need watching, and took the pan anyway.`
  ],
  choices:[
    {t:'I watched Miss Ophelia leave the pea pan.',after:'Her lap kept the round print of the pan a moment after she stood.',go:'c4-8',set:{thresholdNotice:'pan'}},
    {t:'I followed her through the screen door.',after:'The spring drew the door shut behind me without a slam. Outside, Énola kept shelling.',go:'c4-8',set:{thresholdNotice:'door'}}
  ]
},

'c4-8':{
  p:[
`The front room was dim and smelled like camphor and coffee and candle smoke, all of it settled deep in the boards, years of it, a smell with floors underneath floors. She had a shelf on the wall by the window. While she went to the drawer for her thread, I took it item by item, as children do when told to stand still.`,
{doc:
`on the shelf, as I hold it still:

  St. Expedite, plaster, his face rubbed soft
     from handling
  palm from Palm Sunday, three years of it,
     braided together
  a jelly jar of dimes, full past sense
  a photograph, two men in army green,
     one of them gone over with a pin,
     little holes all through,
     never the face, only the hands
  camphor in a blue bottle of Hoyt's
  white thread
  a bell with no clapper in it
  the Infant of Prague in a dress
     Miss \u00C9nola sewed him
  and a fig, a fresh one,
     there every day of the year,
     and nobody eats it`},
`I did not ask about a thing on it. My toes stayed curled against the cool boards and my hands stayed where she could see them.`
  ],
  choices:[
    {t:'My eyes kept returning to the photograph with the hands pricked out.',after:'Window light passed through the pinholes. The two men kept their faces and lost whatever they had held.',go:'c4-9',set:{relic:'photograph'}},
    {t:'I listened for the bell that had no clapper.',after:'A wagon went by outside and the shelf trembled. The little bell moved, keeping its silence exactly.',go:'c4-9',set:{relic:'bell'}},
    {t:'I watched the fresh fig and wondered who replaced it.',after:'Its skin had split at the neck and shone there. No fly came near it.',go:'c4-9',set:{relic:'fig'}}
  ]
},

'c4-9':{
  p:[
s=>({
      photograph:`When she came back with the white string, I looked once at the photograph. Her thumb covered the pinholes in the men’s hands as she passed.`,
      bell:`When she came back with the white string, her skirt touched the little bell. It rocked without a sound.`,
      fig:`When she came back with the white string, the fig had rolled against St. Expedite’s foot. I never saw her touch it.`
    }[s.flags.relic]||null),
`She sat by the window and receded without moving. Chair, dress, hands stayed before me; the woman herself went someplace the room could not follow. Her lips moved below hearing, and her hands worked the <button class="term" data-term="cordon">cordon</button>, a knot, and a going, and a knot.`,
`Nine knots. I counted without deciding to.`
  ],
  choices:[
    {t:'I watched her mouth, trying to catch one word of it.',after:'Her lower lip touched each word and released it without sound. I counted by the dips of her chin.',go:'c4-10',set:{eyes:'mouth'}},
    {t:'I watched the window, the yard standing in the heat.',after:'The hen stopped under the chinaball and held one foot raised. Even the road seemed to wait.',go:'c4-10',set:{eyes:'window'}},
    {t:'I closed my eyes and listened to the house.',after:'Clock, dogs, ice box, whisper. With sight gone, each sound took its place and stayed there.',go:'c4-10',set:{eyes:'closed'}}
  ]
},

'c4-10':{
  p:[
    s=>({
      mouth:`I watched her mouth the whole nine knots and I caught nothing. Nothing in her was hiding it from me. It ran too deep for catching, the way you can stand on the dock and see the water move and never see the thing that moves it. Her lips shaped the same passage over and over, I could tell that much, the same road walked nine times, and each time she came to a certain place in it her chin dipped, like a woman ducking under a clothesline she'd known her whole life.`,
      window:`I gave up on her and watched the yard instead. A hen was working the chinaball shade, dropping her head and going on, dropping her head and going on. The heat stood over the road in that clear ripple that makes the far things swim. The dogs lay like something poured out. And with my eyes on all that ordinary standing world, the whisper behind me ran on and on, and the yard began to feel like it was inside the prayer, hen and all, and I couldn't have told you where the room quit.`,
      closed:`I closed my eyes, and the house came up around me the way a house does when you finally hush. The clock in the back room, going with a hitch in it, like a man walking with one shoe. The dogs breathing under the floor. The ice box out in the kitchen cutting on with a shudder and settling into its hum. And her whisper in the middle of all of it, in the same family as all of it, no stranger than the clock, and no easier to read.`
    }[s.flags.eyes]||`I don't remember where I looked. I remember the whisper, running underneath.`),
`Then she was back. She wound the string in a piece of wax paper, folded it twice, and put it in my hand and closed my fingers on it with both of hers, and her hands were cool, in all that heat, cool as the floor Cletha was lying on.`,
`Tie it where she burns, she said. Over the wrist is fine. It don't touch the ground, not once, so mind how you carry it. Nine days. Then y'all burn it in the yard with a match from your own box, your own house, hear. And piti, look at me. Don't nobody thank me. Not your mama, not you. You thank, you undo. Tell your mama Ophelia said the rain's coming Thursday anyhow.`
  ],
  choices:[
    {t:'I closed my whole hand around the wax paper.',after:'The knots pressed through the fold into my palm, nine small places with no weight to them.',go:'c4-11',set:{carrying:'palm'}},
    {t:'I carried it by the doubled edge.',after:'The paper swung once. I caught it with my other hand before it could point toward the floor.',go:'c4-11',set:{carrying:'edge'}}
  ]
},

'c4-11':{
  p:[
`I had it in my mouth already. Eleven years of raising will load the words in you like a spring. Thank y. It got as far as the teeth.`
  ],
  choices:[
    {t:'I swallowed it whole and said, yes ma\u2019am.',after:'The y burned a little going down. Miss Ophelia watched my throat and let me keep the rest.',go:'c4-12',set:{thank:'swallowed'}},
    {t:'Half of it got out. Than. And I stood there with it hanging.',after:'The broken syllable sat hot in the room. She waited until it had nowhere left to go.',go:'c4-12',set:{thank:'half'}},
    {t:'I asked her instead, what if it falls. What if the string falls.',after:'The question gave my mouth new work. Her eyes went almost smiling and then were still.',go:'c4-12',set:{thank:'asked'}}
  ]
},

'c4-12':{
  p:[
    s=>({
      swallowed:`I swallowed it whole and said, yes ma'am, and she nodded like she'd watched the whole thing happen in my throat, the loading and the catching and the putting away, and was satisfied with the machinery.`,
      half:`Half of it got out. Than. And hung there. She didn't flinch and she didn't help me. She let me stand in it, a beat, two, and then she said, mm, the way you'd note a fish that struck and didn't take, and turned me toward the door with one finger on my shoulder, and no harm was in the house. But I carried that half a word all the way home, heavier than the string.`,
      asked:`She looked at me a long moment, and something moved behind the tea color of her eyes that I'd call a smile if smiles lived that deep. Then it don't fall, she said. That's all the answer I got, and here is what I can report from the far end of my life: it didn't.`
    }[s.flags.thank]||`I said, yes ma'am.`),
`At the door she stopped me with one more thing, said easy, over her shoulder, while she picked the pan of peas back off \u00C9nola's lap.`,
`She said, that string's the same one my uncle Placide handed me, I mean the same prayer, the string's just string. He gave it to me across a fence the year before they took him, nineteen and forty-one, because a prayer dies with you if you hold it, and he knew his year when it came in the gate. I had it for burns first. That was the year the Thibodeaux store went, so I had my practicing early, all them hands. Men will try a door long past trying. Anyhow. It's sun and burns both, that prayer, all one heat to God. Watch the step going down, it's loose on the left.`,
`And she was shelling again before I was off the porch, and \u00C9nola was saying something about the water being low at the landing, and the two of them went back down into the day like two ducks going under, easy as that, and all the road home I held the wax paper level in front of me, both hands under it. Ask me now what childhood was and I see a boy on gravel carrying something that weighed almost nothing.`
  ],
  choices:[
    {t:'I listened until the porch voices folded into the cicadas.',after:'Énola laughed once behind me. After the bend I could no longer tell her voice from the trees.',go:'c4-13',set:{homeward:'voices'}},
    {t:'I counted my steps until the number broke apart.',after:'I lost the count at Onézime’s and began again with the wax paper still level.',go:'c4-13',set:{homeward:'steps'}}
  ]
},

'c4-13':{
  p:[
`Mama tied it on Cletha's wrist where the skin burned, and Cletha slept all afternoon on the floor with her arm laid out beside her like it belonged to the house now. Toward evening she took broth. In the night I woke to a sound I'd quit believing in, which was thunder, way off, walking the parish line, and Thursday, like the woman said, it rained. The first cool air came through the screen about four in the morning and went over all of us in our beds like a hand checking foreheads, and Cletha's fever went out with it, and the frogs set up in the ditch, that whole nation of them, singing the water back.`,
`Next morning Mama dressed a hen and put it in a flour sack with a dozen figs off our own tree, and sent me back down the road. Set it on the step, she told me. Don't knock. And whatever you do, don't say nothing to nobody about it. It goes on the step and you come home.`,
`The dogs walked me in. The porch was empty and the pea pan sat on the boards half full.`
  ],
  director:'c4',
  choices:[
    {t:'I set the sack down and backed away from it.',thread:'house',variants:{house:'I set the sack in the cool square made by the porch roof.',water:'I set the sack above the old rain line and backed away.',voice:'I set the sack down without letting the screen door speak.'},after:'By supper the sack was gone. Nobody named the hen again.',go:'c4-14',set:{gift:'backed'}},
    {t:'I kept one hand on the doorframe for a breath, then left.',thread:'water',variants:{house:'I kept my palm on the warm doorframe for one breath.',water:'I watched the ditch water from the dry porch step, then left.',voice:'I listened at the doorframe for the women and heard only peas.'},after:'The porch board held the heat through my palm. By supper the sack was gone.',go:'c4-14',set:{gift:'doorframe'}},
    {t:'I watched the dogs smell the sack and turn their heads.',thread:'voice',variants:{house:'I watched the dogs carry the house smell from sack to doorway.',water:'I watched the dogs sniff once, then look toward the bayou.',voice:'I waited for one dog to bark. Neither one did.'},after:'The dogs knew better than I did what belonged on that porch. By supper the sack was gone.',go:'c4-14',set:{gift:'dogs'}}
  ]
},

'c4-14':{
  p:[
`Nine days on, Papa struck a match from the box on our own stove shelf and we burned the string in the bare spot in the yard, all four of us standing there for no longer than it takes, and nobody said anything over it, and it went up quick like string does, and Mama swept the little ash into the ground with the side of her shoe, and we ate supper.`,
    s=>({
      mouth:`I'm past fifty now. I still can't tie a knot without my mouth moving. I could not tell you one word my mouth is saying. It runs too deep for catching, and I let it run, the same road walked over and over, and somewhere in it, I believe, a place where a woman ducks under a clothesline.`,
      window:`I'm past fifty now. Some evenings a plain yard, anybody's yard, a hen in it or not, will stand up in the heat and look back at me like it knows it's inside something. I let it look. I don't ask inside of what. I learned the not asking in a front room in 1981 and it has held me the way a floor holds.`,
      closed:`I'm past fifty now, and in a strange house, any strange house, I'll close my eyes before sleep and let the place come up around me, the clocks and the compressors and the breathing, till it all runs together into one thing going along underneath, and I couldn't tell you the day I started calling that one thing praying, but I call it that.`
    }[s.flags.eyes]||`I'm past fifty now, and I still catch my mouth moving over knots, saying I couldn't tell you what.`),
`Cletha lives in Beaumont. She sells insurance, she sings in the choir, she wears bracelets, always has, all up one arm. We have never once talked about it. When she pushes the bracelets up, they stop at the old place on her wrist. Neither of us looks there long. A family can keep a thing forty years without ever setting it on the table.`,
`That summer comes back through the kitchen first. The vinegar and the beans and the cush-cush going, and under all of it, [[smell||the one you kept to yourself]], and Cletha on the cool boards breathing, and Mama's voice gone low, talking to the fever like it was somebody raised wrong but known to the family, somebody you could still, with patience, walk back out the gate.`
  ],
  end:'c4'
}

});
</script>
<script>
/* ========================= CHAPTER ELEVEN · TOUSSAINT · 1993 ========================= */
Object.assign(DATA, {

'c11-1':{
  head:{num:'Chapter Eleven',name:'Toussaint',year:'L\u2019ANSE AUX CH\u00CANES \u00B7 ALL SAINTS \u00B7 1993'},
  p:[
`Come before day on <button class="term" data-term="toussaint">Toussaint</button> if you want the Anse to know you before it sees you. I have come in every wrong way there is, two in the afternoon, nine at night, Christmas, drunk once. Before day on the first of November is the door the place leaves unlocked.`,
`I drove from Houston with a thermos and the radio, and the radio gave out at the parish line like it always does, like there's a fence for it, and after that it was just the tires and the dark thinning out. I turned off the blacktop where the road smells like the syrup mill. The mill has been gone thirty years. Burned, sold, hauled off, I've heard it every way. At the sweetness I turned, same as my mother, same as hers. Whether the road remembered us was a city question. The city was back at the parish line with the radio.`
  ],
  choices:[
    {t:'I switched the radio off before it could leave me.',after:'The dial went dark. Tires, thermos lid, my own breath: the car had been making enough company.',go:'c11-2',set:{arrival:'radio'}},
    {t:'I drank the last coffee where the sweetness began.',after:'It had gone cold and metallic. The old mill smell came through the cracked window warm as bread.',go:'c11-2',set:{arrival:'coffee'}}
  ]
},

'c11-2':{
  p:[
`Tante Velma had the light on in the kitchen and coffee gone half down the pot, which is her way of saying I told you so to nobody. She is my mother's last sister. She put both thumbs under my cheekbones and turned my face once toward the kitchen light. Then she fed me.`,
`We talked the way we talk. Houston. The drive. Her knees. A man named Nolan Simien who has been fixing her pump since June, and June was five months ago, and the pump works fine, which we both let sit there sweetening the coffee. They got frogs in Houston, she asked me, and I said they got frogs, and she said, mais, they ain't ours, and that was the truth and the end of it.`,
`Then she said, looking in her cup, your mama's slab wants two coats this year. The east face specially. It took the weather.`,
`The east face specially, she said again. Her cup stayed between both hands.`
  ],
  choices:[
    {t:'I said, I brought old clothes.',after:'Velma looked at my good shoes and let the answer pass without helping it.',go:'c11-3',set:{answer:'words'}},
    {t:'I put both hands flat on her table.',after:'For one second they were my mother’s hands. Velma saw it and looked into her cup.',go:'c11-3',set:{answer:'hands'}},
    {t:'I finished the coffee and held out my cup.',after:'She filled it without asking. The second cup was the answer she wanted.',go:'c11-3',set:{answer:'cup'}}
  ]
},

'c11-3':{
  p:[
`St. Ambroise sits up on the <button class="term" data-term="cheniere">ch\u00E9ni\u00E8re</button>, the oak ridge, the only ground around here with sense enough to stay dry. The dead got the ridge. The living kept the wet ground. That arrangement has outlasted every promise made at the courthouse.`,
`By eight o'clock the cemetery was half full of the living. Somebody's truck gate down and the drums on it. Children carrying brushes like flags. The <button class="term" data-term="whitewash">whitewash</button> was going in the blue drum by the fence, where it goes. I put down the making because the paddle under the church is older than anybody who remembers who shaped it.`,
{doc:
`whitewash, the way it is done at St. Ambroise:

  quicklime, slaked overnight in the blue drum,
     covered with a truck hood
  salt, a double handful, some say against
     the damp, some say against worse,
     the salt don't care
  a spoon of alum
  cistern water, never the hose
  stirred with the same paddle every year,
     it lives under the church

  two coats on the east faces, one on the west.
  children do the low slabs.
  you don't wash a name you can't say out loud.`},
`Nobody explained that last rule. Lime, names, and mouths had their work, and the brush went where it was told.`
  ],
  choices:[
    {t:'I rubbed a dry bead of lime from the drum rim.',after:'It powdered my thumb white. The wet batch below it turned once around the paddle.',go:'c11-4',set:{ruleNotice:'lime'}},
    {t:'I read the last rule a second time.',after:'You don’t wash a name you can’t say out loud. The sentence stayed plain no matter how long I stood over it.',go:'c11-4',set:{ruleNotice:'name'}}
  ]
},

'c11-4':{
  p:[
`I walked the rows once before I started. I will set down some names. The rest belong to the people who came carrying brushes.`,
{doc:
`ST. AMBROISE \u00B7 the rows \u00B7 as walked

  M\u00C9TOYER \u00B7 FONTENOT \u00B7 LEMELLE \u00B7 DONATTO
  GUILLORY \u00B7 C\u00C9ZAIRE \u00B7 AUZENNE \u00B7 PAPILLION

  ON\u00C9ZIME PAPILLION \u00B7 1900 \u00B7 1949
     the water gave him back at the bend
     that keeps his name

  four small slabs in one row, AUGUST 1927,
     one family name shared between them,
     washed by children, always children

  the row by the far fence with no names on it,
     1931, and it is washed first every year,
     first lime out of the drum,
     and nobody assigns it,
     and it is always done before nine

  OPHELIA BROUSSARD \u00B7 1899 \u00B7 1984
     she asked that the stone not say
     what she was, and so it says
     GONE TO ASK`},
`I stood in front of that last one a while. Gone to ask. The old people say the <button class="term" data-term="traiteuse">traiteuse</button> only asks and Somebody Else answers. GONE TO ASK. Three words, paid for by the letter. The stonecutter could not have known how exact they were.`
  ],
  choices:[
    {t:'I mouthed GONE TO ASK without giving it sound.',after:'The three words fit behind my teeth. A wasp went in and out of the vase beside the stone.',go:'c11-5',set:{stoneNotice:'ophelia'}},
    {t:'I looked from her stone to the nameless row.',after:'Fresh lime was already bright at the far fence. Whoever had begun there kept below the tombs.',go:'c11-5',set:{stoneNotice:'row'}}
  ]
},

'c11-5':{
  p:[
`Velma set me up with a bucket and a flat brush gone soft as a mule's lip, and the morning wanted starting.`
  ],
  choices:[
    {t:'I started with Mama\u2019s slab, east face first, the way I was raised.',after:'Velma tipped the brush toward the east row. I took the bucket where the shadow was leaving.',go:'c11-6a',set:{first:'mama'}},
    {t:'I went and helped the children on the low slabs from August 1927.',after:'A little girl moved her bucket aside just enough to make room for my knees.',go:'c11-6b',set:{first:'children'}},
    {t:'I was early enough. I took the first lime to the row with no names.',after:'The new lime had no skin on it yet. My brush was the first thing to break the surface.',go:'c11-6c',set:{first:'row'}}
  ]
},

'c11-6a':{
  p:[
`The east face had taken the weather like Velma said, gray coming up through last year's white the way a worry comes up through a face. I laid the first coat on slow. Whitewash goes on thin as milk. By the third day it has whitened itself, after the brushes and people are gone.`,
`Her name came up wet and dark under the brush, and I did what everybody does, I said it. Out loud, low. You don't wash a name you can't say. And I found I could say it, that was the report the morning wanted out of me, and the brush went on ahead of my hand like it had the rest.`,
`Around me the whole cemetery was saying names, a syllable here, a whole one there, under the talk and the drums and somebody's radio playing low out of respect and zydeco out of honesty. If you stood still in the middle of it, and I did, one moment, bucket hanging, you heard MÉTOYER from the far row, then DONATTO near the oak, each name lifting clear and falling back into the talk.`
  ],
  choices:[
    {t:'I laid the brush once across Mama’s whole name.',after:'The letters disappeared under milk-white lime, then rose dark again through it.',go:'c11-7',set:{workNotice:'name'}},
    {t:'I worked the weathered east edge until it held.',after:'The soft brush worried the same corner. At last the lime stayed where I put it.',go:'c11-7',set:{workNotice:'edge'}}
  ]
},

'c11-6b':{
  p:[
`The children work the low slabs because the low slabs are their size, and nobody has ever said the other reason out loud in my hearing. Four small ones in a row, August 1927, the water year. One family name between them like one blanket.`,
`I knelt with the children and we washed. They were easy about it the way children are easy in a cemetery they've grown up visiting, which frightens people from off, and shouldn't. A little Guillory girl, six maybe, put her whole hand flat on the wet slab and told me, matter of business, this one's Th\u00E9oph\u00EDle, he's mine, and went on brushing. She meant hers to wash. Maybe she meant more. I kept my grown mouth shut and followed her brush.`,
`The lime dried on my knuckles in little white maps, and the children sang the counting song about the frog, sot crapaud, your tail will burn, take courage, it grows again. No one had taught it while anybody was looking. It reached them all the same.`
  ],
  choices:[
    {t:'I let the little Guillory girl lead the brush.',after:'She corrected my wrist without ceremony and gave me the low side of the stone.',go:'c11-7',set:{workNotice:'child'}},
    {t:'I rubbed the dried lime from my knuckles.',after:'It came away in white scales. The children had already started the frog song over.',go:'c11-7',set:{workNotice:'knuckles'}}
  ]
},

'c11-6c':{
  p:[
`I was early enough, the drum fresh stirred, and I took the first lime to the far fence. This next thing is done. It is never discussed.`,
`A row with no names, from 1931. The stones are river stone, unfaced. Whoever set them set them straight and deep and at night, that much the stones themselves tell you. It is washed first, every Toussaint, before the talk starts, before the drums come down off the truck. Nobody assigns it. You look up some year, in your forties maybe, and understand that whoever gets there first with a bucket simply does it, and that it had not once gone undone in sixty-two years. Whitewash could not invent the names. It kept the stones from vanishing.`,
`I laid the lime on the river stones and said nothing, because there are no names, and you can't say what you weren't given, and the not being given is the whole of what happened, the entire event, still happening, wet under a soft brush on a bright morning.`,
`When I straightened up, Velma was at the drum watching me. She didn't nod. Nodding would make it a thing. She turned and called some child down off the fence, and the day started.`
  ],
  choices:[
    {t:'I began with the stone at the end of the row.',after:'It took the lime dark and gave back no letter. I worked from that silence toward the gate.',go:'c11-7',set:{workNotice:'endstone'}},
    {t:'I listened to the cemetery before the talk began.',after:'Brush on river stone, paddle against drum, one child breathing hard from the run up the ridge.',go:'c11-7',set:{workNotice:'sounds'}}
  ]
},

'c11-7':{
  p:[
`Noon came on and the work loosened. Folding chairs in the oak shade. <button class="term" data-term="boudin">Boudin</button> off somebody’s tailgate. I sat with my back against a Fontenot tomb old enough to hold no grief for anybody living, and the talk of the old women drifted over from the chairs, and I did what I do now that I live away, I wrote some of it down inside myself.`,
{doc:
`overheard, St. Ambroise, the chairs under the oak:

  ...dreamed her Tuesday in a clean dress
     standing by clean water, so I knew,
     and I ironed Wednesday...

  ...water's been wrong at the landing since
     the levee work, the birds'll tell you,
     count the <button class="term" data-term="poules">poules d'eau</button>, go ahead...

  ...seen a man walking the levee by
     On\u00E9zime's, Tuesday gone, and no dog
     went with him...

  ...mais that could be anybody...

  ...could be...

  ...pass me that, ch\u00E8re, the little scissors...`},
`Could be closes a subject without killing it. The man stayed where they had put him, somewhere between living and dead, while the scissors passed.`
  ],
  choices:[
    {t:'I kept the dream of the clean water.',after:'It followed me into Velma’s hall, though no water in the Anse was clean that week.',go:'c11-8',set:{overheard:'dream'}},
    {t:'I counted the water birds in my head.',after:'At the house I found three in the ditch and lost the fourth under the hyacinth.',go:'c11-8',set:{overheard:'birds'}},
    {t:'I stayed with the man walking without a dog.',after:'From Velma’s yard I could see the levee bend. Nothing walked it. No dog watched it either.',go:'c11-8',set:{overheard:'man'}}
  ]
},

'c11-8':{
  p:[
`Velma sent me to the house after the good tablecloth, the one in the cedar chest. I kept what happened there from everybody for thirty-three years.`,
`Under the tablecloth, among my mother’s missal and fans and the envelope of everybody’s hair, lay wax paper gone soft as cloth. Inside was white string, knotted. My hands stopped before my mind named it. Nine.`,
`I never saw my mother sick that I wasn't sick beside her. I never heard tell of a summer it would have come from. She kept it forty years minimum, folded like money, under the cloth we eat off of when somebody dies.`,
  ],
  choices:[
    {t:'I folded the paper and put it back exactly.',after:'The wax paper remembered its creases. I made each one lie down where it had lain.',go:'c11-8a',set:{chest:'folded'}},
    {t:'I held the string to the window for one breath.',after:'Against the glass it looked clean and ordinary. Nine shadows crossed my palm.',go:'c11-8a',set:{chest:'window'}},
    {t:'I laid one finger beside the knots without touching them.',after:'My finger was longer than all nine. That small fact troubled me more than the string.',go:'c11-8a',set:{chest:'measured'}}
  ]
},

'c11-8a':{
  p:[
`I closed the chest slowly. Walking back, I held the tablecloth level in both arms like a full cup. The carrying had come to my hands from somewhere.`
  ],
  choices:[
    {t:'I folded the tablecloth once over my forearms.',after:'The cedar smell rose from it. Under the clean fold my arms remembered the weight of nothing.',go:'c11-9',set:{cloth:'folded'}},
    {t:'I carried the tablecloth open and level.',after:'Its corners lifted in the hall draft and settled before I reached the door.',go:'c11-9',set:{cloth:'level'}}
  ]
},

'c11-9':{
  p:[
`Dusk on Toussaint, candles stood in sand and jars on every slab. The ridge looked settled by people too quiet to show themselves.`,
`Velma lit for her sisters, one and one and one, her lips going, no sound coming up. All down the rows, people with their matches, and the names being said again, softer now, the whole book read twice in one day.`,
`I stood with my match struck and going.`,
`Say the name you came to light for. A whisper does it. It always has.`
  ],
  choices:[
    {t:'I said the name where only the flame could hear.',after:'The flame pinched, straightened, and kept the name.',go:'c11-10',set:{candle:'said'}},
    {t:'I kept the name behind my teeth.',after:'I set the light in the sand without sound. It gave off its little heat all the same.',go:'c11-10',set:{candle:'silent'}},
    {t:'I set the light for somebody whose name was gone.',after:'The match burned close to my fingers before the wick took. I left the jar beside the nameless row.',go:'c11-10',set:{candle:'unnamed'}}
  ]
},

'c11-10':{
  p:[
    s=>s.done&&s.done.c4?
`On Ophelia Broussard's slab, the one that says GONE TO ASK, a light was already burning, first one lit, and it was there before the first families came up the ridge. Nobody claimed it. Nobody wondered at it out loud. Somebody keeps her, is all, some house down one of these roads, and has for nine years, and if you asked at the chairs whose match that was, the old women would look at you kindly, the way you look at somebody from off, and pass the scissors.`:
`On Ophelia Broussard's slab, the one that says GONE TO ASK, somebody had set a light already, early, before the families came up the ridge. Nobody claimed it and nobody wondered at it out loud. Some house down one of these roads keeps her. That is all I can tell you, and around here it is not a small thing to be able to say of a woman nine years gone, somebody keeps her.`,
`The frogs started up down in the ditches while the candles steadied, that whole nation of them, and the two lights, the ones we set and the ones down in the wet, went on together like they'd rehearsed, and no one remarked on it, and I have been to the opera in Houston, and I sat down on a Fontenot slab and listened to this instead.`
  ],
  choices:[
    {t:'I sat on the Fontenot slab and let the frogs cover the voices.',after:'The stone kept the day’s warmth through my clothes. One by one the human voices lowered.',go:'c11-11',set:{dusk:'sat'}},
    {t:'I stayed among the jars until every flame stood straight.',after:'A match smell hung over the rows. Below the ridge, ditch water took the candle light in pieces.',go:'c11-11',set:{dusk:'stood'}}
  ]
},

'c11-11':{
  p:[
`Supper was at Velma's, eleven of us, gumbo she'd had going since before the cemetery, rice in the big pot with the lid that don't fit. After the second bowls, the funeral stories started and somebody laughed before the first one was finished. The time Fr. Melancon's vestments took fire off the Easter candle and he finished the Mass smoking like a <button class="term" data-term="boucherie">boucherie</button>. The time the Donatto brothers, bearing their own mother, got the casket wedged in the church door and had to back her out and come again, and everybody in the pews saying, that's Odile, she never once come through a door the first try in her life.`,
`And in the middle of the serving, ladle in her hand, leaning over the rice, Velma said, this pot's older than me, this was Mama's flood pot. And somebody from off, a young wife, asked what a flood pot was, and Velma said, filling her bowl for her, in twenty-seven we cooked out of it on the roof of the corn crib eleven days. Papa had died the March before, so when the water came up in the house Mama had us tie his coffin to the chinaball with plow line so he wouldn't travel, and she sat up on the crib with us and sang, and he rode it out in the yard like a <button class="term" data-term="pirogue">pirogue</button>, and when the water went down we planted mustard greens over the whole flat, because flood ground is rich, ch\u00E8re, richest greens we ever ate. Here, take the crust corner, that's the best of the rice.`,
`And the young wife took the crust corner, and the table went on, and the young wife looked once around the table to see whether laughter was allowed. Velma was already filling the next bowl.`
  ],
  choices:[
    {t:'I took the crust corner when the bowl came around.',after:'The rice held where it had browned against the pot. Velma watched until I tasted it.',go:'c11-12',set:{supper:'crust'}},
    {t:'I carried the empty bowls to Velma’s sink.',after:'Behind me the flood pot lid began its old rattle. The young wife laughed this time without looking around.',go:'c11-12',set:{supper:'bowls'}}
  ]
},

'c11-12':{
  p:[
`I went out on the back steps late with the dishtowel still over my shoulder. The candles up on the ch\u00E9ni\u00E8re had burned down to a low glow, a town going to bed. The frogs had the dark to themselves.`,
`Across the water toward the bend, a light moved at a man’s pace. No engine followed it. No lantern bobbed. It went along the levee until the bend took it, or it went out.`,
`Behind me the screen door, and Velma beside me with her cup. She looked where I was looking for the time it takes to shell one pea. Gard\u00E9 donc, she said, in the voice she used for weather.`
  ],
  director:'c11',
  choices:[
    {t:'I watched the dark where the light had been.',thread:'record',variants:{kin:'I watched until Velma’s shoulder left mine in the dark.',record:'I kept my eyes on the last place the light could be named.',threshold:'I watched the bend where light had crossed out of sight.'},after:'I stayed until the dark had no seam in it. Fear never came. The porch boards stayed ordinary under my feet.',go:'c11-13',set:{light:'watched'}},
    {t:'I said Velma’s name before she reached the door.',thread:'kin',variants:{kin:'I called Velma the way my mother used to call her.',record:'I said Velma’s name once, clear enough to keep it.',threshold:'I called her back from the screen-door light.'},after:'She turned with one hand on the screen. I asked what she had seen. She said, your hat is still no good, and went in.',go:'c11-13',set:{light:'called'}},
    {t:'I followed her back inside.',thread:'threshold',variants:{kin:'I followed my mother’s sister back to the kitchen.',record:'I left the moving light unrecorded and went inside.',threshold:'I crossed the screen-door sill behind her.'},after:'Velma had left my cup by the sink. I washed it while the last candle on the ridge went out.',go:'c11-13',set:{light:'inside'}}
  ]
},

'c11-13':{
  p:[
`Morning after Toussaint, we wrapped the brushes in a feed sack, the paddle went back under the church, and the blue drum got its truck hood. All of it stored where it lives, sleeping its year.`,
`Velma held my face in the doorway again, the second reading. Same time next year, ch\u00E8re, she said. Bring a better hat.`,
`I drove past the landing and the bend. My hands took the far side without asking me. At the sweetness I lowered the window one inch. It was gone by the blacktop.`
  ],
  end:'c11'
}
